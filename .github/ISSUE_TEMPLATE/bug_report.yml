name: Bug report
description: Report behavior that does not match Poiera's intended plan, authority, or verification contract.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the smallest agent workflow or release plan that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the intended plan, authority boundary, or verification result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the intent, environment, relevant commands, and execution stage.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Poiera version or commit
      placeholder: Commit SHA, branch, or release
  - type: textarea
    id: environment
    attributes:
      label: Environment and drivers
      description: Operating system, runtime, connected drivers, deployment target, and other relevant details.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add plan digests, receipts, logs, screenshots, or links with secrets removed.
